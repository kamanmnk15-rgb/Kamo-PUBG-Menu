name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          # دابەزاندنی وەشانێکی دیاریکراوی SDK کە کێشەی std_tuple ی نییە
          mkdir -p ~/theos/sdks
          curl -L https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz -o ~/theos/sdks/sdk.tar.xz
          tar -xf ~/theos/sdks/sdk.tar.xz -C ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # فەرمانی تایبەت بۆ ناچارکردنی بەکارهێنانی SDK 14.5
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # ئەم دوو دێڕە زۆر گرنگن بۆ چارەسەری std_tuple و فایلەکان
          export OBJCFLAGS="-I. -I./Esp -I./KittyMemory -isysroot ~/theos/sdks/iPhoneOS14.5.sdk"
          export COMMON_FLAGS="-isysroot ~/theos/sdks/iPhoneOS14.5.sdk"
          
          make package FINALPACKAGE=1 THEOS=~/theos SDKVERSION=14.5 SYSROOT=~/theos/sdks/iPhoneOS14.5.sdk
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
