name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # گۆڕینی سیستم بۆ وەشانێکی جێگیر کە کێشەی std_tuple ی نییە
          sed -i '' 's|^THEOS =.*|THEOS = ~/theos|g' Makefile
          echo "export SDKVERSION=14.5" >> ~/.bash_profile
          
          # لێنان بە فەرمانی تایبەت
          make package FINALPACKAGE=1 THEOS=~/theos SYSROOT=~/theos/sdks/iPhoneOS14.5.sdk
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
