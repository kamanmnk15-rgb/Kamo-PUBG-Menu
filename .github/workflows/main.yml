name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # زیادکردنی پشتگیری بۆ C++ و کتێبخانە ستانداردەکان
          export OBJCFLAGS="-I. -I./Esp -I./KittyMemory -fno-modules -std=c++11 -stdlib=libc++"
          export COMMON_FLAGS="-fno-modules"
          
          # لێنان بە ڕێگایەکی زۆر جێگیر
          make package FINALPACKAGE=1 THEOS=~/theos SDKVERSION=14.5 TARGET=iphone:clang:latest:14.5
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
