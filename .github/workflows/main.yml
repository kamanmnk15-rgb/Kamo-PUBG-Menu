name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Setup SDK (No Extract)
        run: |
          # لێرەدا ڕاستەوخۆ SDK لە ڕێگەی گیتەوە دادەبەزێنین بۆ ئەوەی تووشی هەڵەی فایل نەبین
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Build Menu
        run: |
          # دۆزینەوەی مەکفایل لە هەر شوێنێک بێت
          MAKEFILE_PATH=$(find . -name Makefile -maxdepth 3 | head -n 1)
          cd $(dirname "$MAKEFILE_PATH")
          
          # چاککردنی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # لێنان بە وەشانی 14.5 کە لە ناو گیتەکەدا هەیە
          make package FINALPACKAGE=1 THEOS=~/theos \
          SDKVERSION=14.5 \
          THEOS_DEVICE_ARCH=arm64 \
          ADDITIONAL_CFLAGS="-fno-modules -Wno-error" \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Final-Package
          path: "**/packages/*.deb"
