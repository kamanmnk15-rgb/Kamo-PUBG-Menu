name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean and Setup Theos
        run: |
          brew install ldid
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Extract Project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          MAKE_LOC=$(find . -name "Makefile" -not -path "*/.*" | head -n 1)
          echo "PROJECT_ROOT=$(dirname "$MAKE_LOC")" >> $GITHUB_ENV

      - name: Build Menu (Final Logic Fix)
        run: |
          cd ${{ env.PROJECT_ROOT }}
          
          # چاککردنی مەکفایل بە شێوەیەکی توند
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # زیادکردنی ڕێڕەوی کتێبخانەکانی C++ کە بریتین لە cmath و هاوڕێکانی
          echo "ADDITIONAL_CFLAGS += -I\$(THEOS)/sdks/iPhoneOS14.5.sdk/usr/include/c++/v1 -I\$(THEOS)/sdks/iPhoneOS14.5.sdk/usr/include -fno-modules" >> Makefile
          echo "ADDITIONAL_CXXFLAGS += -I\$(THEOS)/sdks/iPhoneOS14.5.sdk/usr/include/c++/v1 -I\$(THEOS)/sdks/iPhoneOS14.5.sdk/usr/include -fno-modules -std=c++17" >> Makefile
          echo "Example_LDFLAGS += -lc++" >> Makefile
          
          # سڕینەوەی @import کە کێشەی MetalKit و ModelIO دروست دەکات
          find . -name "*.mm" -o -name "*.h" | xargs sed -i '' 's|@import \(.*\);|#import <\1/\1.h>|g'
          
          make package FINALPACKAGE=1 \
          THEOS=~/theos \
          ARCHS=arm64 \
          SDKVERSION=14.5 \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Deb-Success
          path: "**/*.deb"
