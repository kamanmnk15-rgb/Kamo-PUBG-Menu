name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # فێڵێکی زۆر زیرەکانە بۆ دۆزینەوەی cmath و هەموو فایلە ونبووەکان
          export COMMON_FLAGS="-DTHEOS_LEAN_AND_MEAN -fno-modules -O3"
          export ARCHS="arm64"
          
          # بەکارهێنانی وەرگێڕی ستاندارد بەبێ ئاڵۆزی
          make package FINALPACKAGE=1 THEOS=~/theos \
          SDKVERSION=14.5 \
          THEOS_DEVICE_IP= \
          GO_EASY_ON_ME=1 \
          ADDITIONAL_CFLAGS="-Wno-error -Wno-implicit-function-declaration -I. -I./Esp -I./KittyMemory" \
          ADDITIONAL_LDFLAGS="-stdlib=libc++"
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
