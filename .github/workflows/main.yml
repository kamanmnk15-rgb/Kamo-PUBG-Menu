name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          # دابەزاندنی تەنها یەک SDK کە سووک بێت
          mkdir -p ~/theos/sdks
          curl -L https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz -o ~/theos/sdks/sdk.tar.xz
          tar -xf ~/theos/sdks/sdk.tar.xz -C ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # زیادکردنی ڕێڕەوی فۆڵدەرەکان بۆ ئەوەی x2nios.h بدۆزێتەوە
          export OBJCFLAGS="-I. -I./Esp -I./KittyMemory"
          
          make package FINALPACKAGE=1 THEOS=~/theos
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
