name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Download SDK (Fixed)
        run: |
          mkdir -p ~/theos/sdks
          # بەکارهێنانی لینکێکی جێگیرتر بۆ SDK
          curl -ksL "https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz" -o sdk.tar.xz
          # تاقیکردنەوەی کردنەوەی فایلەکە بە فەرمانێکی جیاواز
          tar -xJf sdk.tar.xz -C ~/theos/sdks
          rm sdk.tar.xz

      - name: Build Menu
        run: |
          # دۆزینەوەی مەکفایل لە هەر شوێنێک بێت
          MAKEFILE_PATH=$(find . -name Makefile -maxdepth 3 | head -n 1)
          cd $(dirname "$MAKEFILE_PATH")
          
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          make package FINALPACKAGE=1 THEOS=~/theos \
          SDKVERSION=14.5 \
          THEOS_DEVICE_ARCH=arm64 \
          ADDITIONAL_CFLAGS="-fno-modules -Wno-error" \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Deb-Success
          path: "**/packages/*.deb"
