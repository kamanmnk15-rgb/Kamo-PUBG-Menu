name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build Hack
        run: |
          unzip *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # لێرە بە وردی Makefile چاک دەکەین بەبێ ئەوەی تێکی بدەین
          sed -i '' 's|^THEOS =.*|THEOS = ~/theos|g' Makefile
          sed -i '' 's|/var/mobile/theos|$(THEOS)|g' Makefile
          
          make package FINALPACKAGE=1 THEOS=~/theos
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
