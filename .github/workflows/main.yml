name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos and SDK
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          # بەکارهێنانی فەرمانی ئامادە بۆ دابەزاندنی SDK بەبێ کێشەی فۆرمات
          cd ~/theos/sdks
          git clone https://github.com/theos/sdks.git temp_sdks
          mv temp_sdks/*.sdk .
          rm -rf temp_sdks
          
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Menu
        run: |
          # دڵنیابوونەوە لەوەی فایلەکان لە شوێنی خۆیانن
          PROJECT_DIR=$(pwd)
          if [ -d "IMGUI-Mod-Menu-iOS-Template-main" ]; then
            cd IMGUI-Mod-Menu-iOS-Template-main
          fi
          
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          make package FINALPACKAGE=1 THEOS=~/theos \
          SDKVERSION=14.5 \
          THEOS_DEVICE_ARCH=arm64 \
          ADDITIONAL_CFLAGS="-fno-modules -Wno-error" \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Deb-Fixed
          path: "**/packages/*.deb"
