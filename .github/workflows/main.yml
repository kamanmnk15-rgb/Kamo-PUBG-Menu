name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی مەکفایل بۆ ناو نیشانی تیۆس
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # ئەمە گرنگترین بەشە: وەستاندنی مۆدیولەکان بە شێوەی جێگیر
          export COMMON_FLAGS="-fno-modules -fno-module-maps -DTHEOS_LEAN_AND_MEAN"
          
          # لێنان بە ناچارکردنی بەکارهێنانی کتێبخانەی گرافیکی بە شێوەی دەستی
          make package FINALPACKAGE=1 THEOS=~/theos \
          SDKVERSION=14.5 \
          ADDITIONAL_CFLAGS="-I. -I./Esp -I./KittyMemory -fno-modules -fno-module-maps" \
          ADDITIONAL_LDFLAGS="-Wl,-framework,Metal -Wl,-framework,MetalKit -Wl,-framework,ModelIO -stdlib=libc++" \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
