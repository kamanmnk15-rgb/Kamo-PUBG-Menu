name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          # دابەزاندنی SDK بە ڕێگایەکی جیاواز کە تێک ناچێت
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی ڕێڕەوەکان
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # پێناسەکردنی شوێنی فایلەکان بۆ ئەوەی x2nios.h بدۆزێتەوە
          export OBJCFLAGS="-I. -I./Esp -I./KittyMemory"
          
          make package FINALPACKAGE=1 THEOS=~/theos
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
