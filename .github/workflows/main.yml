name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos and SDK
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          mkdir -p ~/theos/sdks
          # دابەزاندنی SDK بە ڕێگایەکی جێگیر
          curl -L "https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz" -o sdk.tar.xz
          tar -xf sdk.tar.xz -C ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Menu
        run: |
          # دۆزینەوەی فۆڵدەری سەرەکی پڕۆژەکە بە شێوەی ئۆتۆماتیکی
          MAKEFILE_PATH=$(find . -name Makefile -maxdepth 3 | head -n 1)
          PROJECT_DIR=$(dirname "$MAKEFILE_PATH")
          echo "بۆ دۆزینەوەی فایلەکان دەچینە ناو: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # چاککردنی ڕێڕەوی تیۆس
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # دەستپێکردنی Build
          make package FINALPACKAGE=1 THEOS=~/theos \
          SDKVERSION=14.5 \
          THEOS_DEVICE_ARCH=arm64 \
          ADDITIONAL_CFLAGS="-fno-modules -Wno-error" \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Deb-Finished
          path: "**/packages/*.deb"
