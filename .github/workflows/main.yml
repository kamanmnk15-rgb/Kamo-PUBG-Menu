name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          # سڕینەوەی هەموو شتێکی کۆن بۆ ئەوەی هەڵە نەیەت
          rm -rf ~/theos
          
          # دابەزاندنی تیۆس
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          # دابەزاندنی SDK بە فەرمانی بەهێز
          mkdir -p ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/temp_sdks
          mv ~/temp_sdks/* ~/theos/sdks/
          rm -rf ~/temp_sdks
          
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # زیادکردنی ڕێڕەوی فۆڵدەرەکان بۆ دۆزینەوەی فایلەکان
          export OBJCFLAGS="-I. -I./Esp -I./KittyMemory"
          
          make package FINALPACKAGE=1 THEOS=~/theos
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
