name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o iOS-IMGUI-Mod-Menu-Templates-main.zip
          
          # دۆزینەوەی فۆڵدەری سەرەکی
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # ئەم دێڕە کێشەی x2nios.h چاک دەکات بە زیادکردنی ناونیشانی فۆڵدەرەکان بۆ ناو Makefile
          sed -i '' 's|^THEOS =.*|THEOS = ~/theos|g' Makefile
          sed -i '' 's|/var/mobile/theos|$(THEOS)|g' Makefile
          
          # فەرمانی دروستکردن بە شێوازێک کە هەموو فایلەکان بدۆزێتەوە
          make package FINALPACKAGE=1 THEOS=~/theos ADDITIONAL_CFLAGS="-I. -I./src -I./Includes"
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
