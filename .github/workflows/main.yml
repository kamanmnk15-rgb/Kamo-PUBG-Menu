name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی ڕێڕەوە هەڵەکانی ناو مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          sed -i '' 's|include $(THEOS)/makefiles/common.mk|include ~/theos/makefiles/common.mk|g' Makefile
          sed -i '' 's|include $(THEOS_MAKE_PATH)/tweak.mk|include ~/theos/makefiles/tweak.mk|g' Makefile
          
          make package FINALPACKAGE=1 THEOS=~/theos
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
