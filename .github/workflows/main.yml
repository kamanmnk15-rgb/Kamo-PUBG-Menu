name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          # دۆزینەوەی فۆڵدەری سەرەکی پڕۆژەکە
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی مەکفایل و زیادکردنی ڕێڕەوی فایلەکان
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # ئەم دێڕە کێشەی x2nios.h چارەسەر دەکات
          export OBJCFLAGS="-I. -I./Esp -I./KittyMemory"
          export CFLAGS="-I. -I./Esp -I./KittyMemory"
          
          make package FINALPACKAGE=1 THEOS=~/theos
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
