name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # فێڵێکی زۆر تایبەت بۆ چارەسەری MetalKit و ModelIO
          # لێرەدا پێی دەڵێین بە هێز (Force) ئەو مۆدیولانە بپەڕێنە
          export COMMON_FLAGS="-DTHEOS_LEAN_AND_MEAN -fno-modules -fno-module-maps"
          
          make package FINALPACKAGE=1 THEOS=~/theos SDKVERSION=14.5 \
          ADDITIONAL_CFLAGS="-I. -I./Esp -I./KittyMemory -Wno-error -Wno-module-import-in-extern-c" \
          ADDITIONAL_OBJCCFLAGS="-fno-modules -fno-module-maps"
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
