name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          # داگرتنی تیۆس بەبێ SDK بۆ ئەوەی کێشەی ریکوێست دروست نەبێت
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          # بازدان لە قۆناغی زیپ ئەگەر فایلەکان پێشتر هەبن
          unzip H5GG-main.zip || true
          
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی مەکفایل
          sed -i '' 's|^THEOS =.*|THEOS = ~/theos|g' Makefile
          sed -i '' 's|/var/mobile/theos|$(THEOS)|g' Makefile
          
          # فەرمانی دروستکردن بەبێ چاوەڕێکردنی SDK
          make package FINALPACKAGE=1 THEOS=~/theos
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
