name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean and Setup Theos
        run: |
          brew install ldid
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          mv ~/theos/sdks/iPhoneOS*.sdk ~/theos/sdks/iPhoneOS.sdk || true
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Extract Project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          MAKE_LOC=$(find . -name "Makefile" -not -path "*/.*" | head -n 1)
          echo "PROJECT_ROOT=$(dirname "$MAKE_LOC")" >> $GITHUB_ENV

      - name: Build Menu (Final Success)
        run: |
          cd ${{ env.PROJECT_ROOT }}
          
          # چاککردنی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # چارەسەری هەڵەی Linker (ئەم بەشە نوێیە)
          echo "Example_FRAMEWORKS = UIKit Foundation Metal MetalKit QuartzCore CoreGraphics CoreText" >> Makefile
          echo "ADDITIONAL_LDFLAGS += -lstdc++ -lc++" >> Makefile
          
          # کوژاندنەوەی مۆدیوڵەکان و زیادکردنی ڕێڕەوی C++
          echo "ADDITIONAL_CFLAGS += -fno-modules -fno-module-maps -I\$(THEOS)/sdks/iPhoneOS.sdk/usr/include" >> Makefile
          echo "ADDITIONAL_CXXFLAGS += -fno-modules -fno-module-maps -std=c++17 -stdlib=libc++ -I\$(THEOS)/sdks/iPhoneOS.sdk/usr/include/c++/v1" >> Makefile
          
          # گۆڕینی @import بۆ #import
          find . -name "*.mm" -o -name "*.h" -o -name "*.cpp" | xargs sed -i '' 's|@import \(.*\);|#import <\1/\1.h>|g'
          
          # لێنانی کۆتایی
          make package FINALPACKAGE=1 \
          THEOS=~/theos \
          ARCHS=arm64 \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-PUBG-Menu-Success
          path: "**/*.deb"
