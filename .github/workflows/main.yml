name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean and Setup Theos
        run: |
          brew install ldid
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          # لێرەدا ناوەکە دەگۆڕین بۆ ئەوەی سیستمەکە بە ئاسانی بیدۆزێتەوە
          mv ~/theos/sdks/iPhoneOS*.sdk ~/theos/sdks/iPhoneOS.sdk || true
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Extract Project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          MAKE_LOC=$(find . -name "Makefile" -not -path "*/.*" | head -n 1)
          echo "PROJECT_ROOT=$(dirname "$MAKE_LOC")" >> $GITHUB_ENV

      - name: Build Menu (Final Force)
        run: |
          cd ${{ env.PROJECT_ROOT }}
          
          # نوێکردنەوەی مەکفایل بۆ ناوە نوێیەکەی SDK
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # زیادکردنی ڕێڕەوی کتێبخانەکان بە شێوەیەکی گشتی
          echo "ADDITIONAL_CFLAGS += -I\$(THEOS)/sdks/iPhoneOS.sdk/usr/include/c++/v1 -fno-modules" >> Makefile
          echo "ADDITIONAL_CXXFLAGS += -I\$(THEOS)/sdks/iPhoneOS.sdk/usr/include/c++/v1 -fno-modules -std=c++17" >> Makefile
          
          # لابردنی مۆدیوڵەکان لەناو فایلەکان
          find . -name "*.mm" -o -name "*.h" | xargs sed -i '' 's|@import \(.*\);|#import <\1/\1.h>|g'
          
          # لێنانی پڕۆژەکە بەبێ دیاریکردنی ڤێرژنی ورد (بۆ ئەوەی هەڵە نەدات)
          make package FINALPACKAGE=1 \
          THEOS=~/theos \
          ARCHS=arm64 \
          SDKVERSION= \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Deb-Success
          path: "**/*.deb"
