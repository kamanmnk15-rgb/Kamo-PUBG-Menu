name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Setup SDK (No Extract)
        run: |
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Build Menu
        run: |
          # گەڕان بەدوای مەکفایل و چوونە ناو فۆڵدەرەکەی
          find . -name "Makefile" -exec dirname {} \; | xargs -I {} cd {}
          
          # دڵنیابوونەوە لە شوێنی فایلەکە
          ls -R
          
          # جێگیرکردنی تیۆس و لێنان
          sed -i '' 's|/var/mobile/theos|~/theos|g' $(find . -name "Makefile")
          
          make package FINALPACKAGE=1 THEOS=~/theos \
          SDKVERSION=14.5 \
          THEOS_DEVICE_ARCH=arm64 \
          ADDITIONAL_CFLAGS="-fno-modules -Wno-error" \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Final-Package
          path: "**/packages/*.deb"
