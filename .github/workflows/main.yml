name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Setup SDK (Integrated)
        run: |
          # بەکارهێنانی SDKی ناو خودی Xcode بۆ نەمانی هەڵەی cmath
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Extract Project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          MAKE_LOC=$(find . -name "Makefile" -not -path "*/.*" | head -n 1)
          echo "PROJECT_ROOT=$(dirname "$MAKE_LOC")" >> $GITHUB_ENV

      - name: Build Menu (Final Force)
        run: |
          cd ${{ env.PROJECT_ROOT }}
          
          # نوێکردنەوەی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # چاککردنی کۆدەکان بۆ ئەوەی مۆدیوڵەکان نەیەڵن
          find . -name "*.mm" -o -name "*.h" | xargs sed -i '' 's|@import MetalKit;|#import <MetalKit/MetalKit.h>|g'
          find . -name "*.mm" -o -name "*.h" | xargs sed -i '' 's|@import ModelIO;|#import <ModelIO/ModelIO.h>|g'
          
          # لێنان بە بەکارهێنانی فانی زۆر توند
          make package FINALPACKAGE=1 THEOS=~/theos \
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
          THEOS_DEVICE_ARCH=arm64 \
          ADDITIONAL_CFLAGS="-fno-modules -Wno-error" \
          ADDITIONAL_CXXFLAGS="-stdlib=libc++" \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Deb-Success
          path: "**/*.deb"
