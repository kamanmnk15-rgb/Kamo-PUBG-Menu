name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # چارەسەری کۆتایی بۆ cmath و MetalKit بە ڕێگای دەستی
          export COMMON_FLAGS="-DTHEOS_LEAN_AND_MEAN -fno-modules -fno-module-maps -w"
          
          # نیشاندانی شوێنی فایلەکان بە وەرگێڕەکە بە شێوەی ڕاستەوخۆ
          make package FINALPACKAGE=1 THEOS=~/theos \
          SDKVERSION=14.5 \
          THEOS_DEVICE_ARCH=arm64 \
          ADDITIONAL_CFLAGS="-I. -I./Esp -I./KittyMemory -fno-modules" \
          ADDITIONAL_CXXFLAGS="-I$THEOS/sdks/iPhoneOS14.5.sdk/usr/include/c++/v1 -stdlib=libc++ -std=c++11 -fno-modules" \
          ADDITIONAL_LDFLAGS="-stdlib=libc++ -Wl,-framework,Metal -Wl,-framework,MetalKit -Wl,-framework,ModelIO" \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
