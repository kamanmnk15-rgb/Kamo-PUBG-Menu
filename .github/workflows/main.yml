name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # چارەسەری کۆتایی بۆ KittyMemory و C++ Config
          export OBJCFLAGS="-I. -I./Esp -I./KittyMemory -DTHEOS_LEAN_AND_MEAN -fno-modules"
          export CFLAGS="-DTHEOS_LEAN_AND_MEAN"
          
          # فەرمانەکە بەبێ بەکارهێنانی وەشانی زۆر نوێی Xcode
          make package FINALPACKAGE=1 THEOS=~/theos SDKVERSION=14.5 \
          TARGET=iphone:clang:14.5:14.5 \
          ADDITIONAL_CFLAGS="-Wno-error -Wno-implicit-function-declaration"
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
