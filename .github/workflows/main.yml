name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
      - name: Build Hack
        run: |
          unzip *.zip
          # ئەم دێڕە خۆی دەچێتە ناو ئەو فۆڵدەرەی Makefile ی تێدایە
          cd $(dirname $(find . -name Makefile | head -1))
          make package
      - name: Upload Result
        uses: actions/upload-artifact@v3
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
