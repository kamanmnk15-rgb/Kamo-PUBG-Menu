name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean and Setup Theos
        run: |
          brew install ldid
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          # ڕێکخستنی ناوی SDK بۆ ئەوەی هیچ کێشەیەک نەمێنێت
          mv ~/theos/sdks/iPhoneOS*.sdk ~/theos/sdks/iPhoneOS.sdk || true
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Extract Project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          MAKE_LOC=$(find . -name "Makefile" -not -path "*/.*" | head -n 1)
          echo "PROJECT_ROOT=$(dirname "$MAKE_LOC")" >> $GITHUB_ENV

      - name: Build Menu (The Final Solution)
        run: |
          cd ${{ env.PROJECT_ROOT }}
          
          # نوێکردنەوەی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # کوژاندنەوەی مۆدیوڵەکان بەتەواوی (بۆ چارەسەری هەڵەی std_stdint_h)
          echo "ADDITIONAL_CFLAGS += -fno-modules -fno-module-maps -Wno-module-import-in-extern-c" >> Makefile
          echo "ADDITIONAL_CXXFLAGS += -fno-modules -fno-module-maps -Wno-module-import-in-extern-c -std=c++17 -stdlib=libc++" >> Makefile
          
          # زیادکردنی ڕێڕەوی کتێبخانەکان
          echo "ADDITIONAL_CFLAGS += -I\$(THEOS)/sdks/iPhoneOS.sdk/usr/include" >> Makefile
          echo "ADDITIONAL_CXXFLAGS += -I\$(THEOS)/sdks/iPhoneOS.sdk/usr/include/c++/v1" >> Makefile
          
          # گۆڕینی @import بۆ #import لە هەموو فایلەکاندا
          find . -name "*.mm" -o -name "*.h" -o -name "*.cpp" | xargs sed -i '' 's|@import \(.*\);|#import <\1/\1.h>|g'
          
          # لێنانی پاتکەکە
          make package FINALPACKAGE=1 \
          THEOS=~/theos \
          ARCHS=arm64 \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Success-File
          path: "**/*.deb"
