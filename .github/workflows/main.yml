name: Build_Kamo_Final
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean and Setup Theos
        run: |
          brew install ldid
          sudo rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Extract Project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          MAKE_LOC=$(find . -name "Makefile" -not -path "*/.*" | head -n 1)
          echo "PROJECT_ROOT=$(dirname "$MAKE_LOC")" >> $GITHUB_ENV

      - name: Build Menu (Deep Module Fix)
        run: |
          cd ${{ env.PROJECT_ROOT }}
          
          # چاککردنی مەکفایل و کوژاندنەوەی مۆدیوڵەکان لە ڕەگەوە
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          echo "ADDITIONAL_CFLAGS += -fno-modules -fno-module-maps" >> Makefile
          echo "ADDITIONAL_OBJCCFLAGS += -fno-modules -fno-module-maps" >> Makefile
          
          # گۆڕینی هەرچی @import هەیە بۆ #import لە ناو هەموو فایلەکاندا
          grep -rl "@import" . | xargs sed -i '' 's|@import \(.*\);|#import <\1/\1.h>|g'
          
          # لێنانی پڕۆژەکە
          make package FINALPACKAGE=1 \
          THEOS=~/theos \
          ARCHS=arm64 \
          SDKVERSION=14.5 \
          GO_EASY_ON_ME=1
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Deb-Final-Ready
          path: "**/*.deb"
