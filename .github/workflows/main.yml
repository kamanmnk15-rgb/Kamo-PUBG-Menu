name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          # کردنەوەی ئەو فایلەی کە لە وێنەکەدا بینیمان
          unzip -o iOS-IMGUI-Mod-Menu-Templates-main.zip
          
          # دۆزینەوەی ناونیشانی دروستی پڕۆژەکە
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی فایلەکان بۆ ئەوەی یەکتری بدۆزنەوە
          sed -i '' 's|^THEOS =.*|THEOS = ~/theos|g' Makefile
          sed -i '' 's|/var/mobile/theos|$(THEOS)|g' Makefile
          
          # دەستپێکردنی دروستکردن
          make package FINALPACKAGE=1 THEOS=~/theos
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
