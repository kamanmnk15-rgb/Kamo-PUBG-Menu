name: Build_Kamo_Hack
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          # سڕینەوەی هەموو شتێک بۆ دڵنیایی
          sudo rm -rf ~/theos
          
          # دابەزاندنی تیۆس بە شێوەیەکی خاوێن
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          # دابەزاندنی SDKەکان بەبێ هەڵەی "Already exists"
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Hack
        run: |
          unzip -o *.zip
          PROJECT_DIR=$(dirname $(find . -name Makefile | head -1))
          cd "$PROJECT_DIR"
          
          # چاککردنی مەکفایل
          sed -i '' 's|/var/mobile/theos|~/theos|g' Makefile
          
          # چارەسەری کێشەی std_tuple بە بەکارهێنانی وەشانی جێگیر
          # و دۆزینەوەی فایلە ونبووەکانی وەک x2nios.h
          make package FINALPACKAGE=1 THEOS=~/theos SDKVERSION=14.5 OBJCFLAGS="-I. -I./Esp -I./KittyMemory"
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kamo-Hack-File
          path: "**/packages/*.deb"
