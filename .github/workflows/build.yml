name: Build
on: push
jobs:
  build_job:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
    - name: Compile
      run: |
        export THEOS=~/theos
        make FINALPACKAGE=1
      continue-on-error: true
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: KamoDylib
        path: ./.theos/obj/arm64/*.dylib
