name: Build
on: push
jobs:
  build_job:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
    - name: Compile
      run: |
        export THEOS=~/theos
        make FINALPACKAGE=1
    - name: Upload
      uses: actions/upload-artifact@v3
      with:
        name: KamoDylib
        path: ./*.dylib
